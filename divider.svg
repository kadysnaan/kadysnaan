<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="12" viewBox="0 0 1000 12" role="presentation">
  <defs>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="repeat">
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="500 0" dur="3s" repeatCount="indefinite"/>
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="0.5" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <rect x="0" y="5" width="1000" height="2" rx="1" fill="url(#flow)"/>
  <circle cx="0" cy="6" r="4" fill="#ddd6fe">
    <animate attributeName="cx" from="0" to="1000" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
