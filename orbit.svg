<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Órbita de tecnologias: JS, HTML, CSS e Git em uso; Node, React, TypeScript e SQL a caminho">
